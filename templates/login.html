<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | St Xavier's High School</title>
  
  <!-- Poppins Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --navy: #0B2545;
      --navy-dark: #07162c;
      --gold: #C9A84C;
      --gold-hover: #E8C97E;
      --white: #FFFFFF;
      --error-bg: rgba(239, 68, 68, 0.15);
      --error-text: #f87171;
      --success-bg: rgba(16, 185, 129, 0.15);
      --success-text: #34d399;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: radial-gradient(circle at center, var(--navy) 0%, var(--navy-dark) 100%);
      color: var(--white);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    /* Decorative background blobs for rich aesthetics */
    body::before, body::after {
      content: '';
      position: absolute;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: var(--gold);
      opacity: 0.05;
      filter: blur(80px);
      z-index: 0;
    }
    
    body::before {
      top: 15%;
      left: 15%;
    }
    
    body::after {
      bottom: 15%;
      right: 15%;
    }

    .login-container {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      z-index: 1;
      animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo-area {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo-area h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--white);
      letter-spacing: 0.5px;
    }

    .logo-area h1 span {
      color: var(--gold);
    }

    .logo-area p {
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.6);
      margin-top: 5px;
    }

    .form-group {
      margin-bottom: 24px;
      position: relative;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 8px;
      color: rgba(255, 255, 255, 0.8);
      letter-spacing: 0.5px;
    }

    .input-wrapper {
      position: relative;
    }

    .form-control {
      width: 100%;
      padding: 14px 16px 14px 44px;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      font-family: 'Poppins', sans-serif;
      font-size: 0.95rem;
      color: var(--white);
      transition: all 0.3s ease;
    }

    .form-control:focus {
      outline: none;
      border-color: var(--gold);
      background: rgba(0, 0, 0, 0.35);
      box-shadow: 0 0 12px rgba(201, 168, 76, 0.25);
    }

    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(255, 255, 255, 0.4);
      transition: color 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .form-control:focus + .input-icon {
      color: var(--gold);
    }

    .btn-login {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--gold) 0%, #B3913B 100%);
      border: none;
      border-radius: 8px;
      font-family: 'Poppins', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      color: var(--navy-dark);
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(201, 168, 76, 0.2);
      margin-top: 10px;
    }

    .btn-login:hover {
      background: linear-gradient(135deg, var(--gold-hover) 0%, var(--gold) 100%);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(201, 168, 76, 0.35);
    }

    .btn-login:active {
      transform: translateY(0);
    }

    /* Alert / Flash Styling */
    .alerts-container {
      margin-bottom: 20px;
    }

    .alert {
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid transparent;
      animation: shake 0.5s ease-in-out;
    }

    .alert-error {
      background: var(--error-bg);
      color: var(--error-text);
      border-color: rgba(239, 68, 68, 0.2);
    }

    .alert-success {
      background: var(--success-bg);
      color: var(--success-text);
      border-color: rgba(16, 185, 129, 0.2);
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      75% { transform: translateX(4px); }
    }

    .back-to-home {
      display: block;
      text-align: center;
      margin-top: 25px;
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.5);
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .back-to-home:hover {
      color: var(--gold);
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="logo-area">
      <h1>St. Xavier's <span>Admin</span></h1>
      <p>Control Panel Authentication</p>
    </div>

    <!-- Flask Flash Messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="alerts-container" role="alert">
          {% for category, message in messages %}
            <div class="alert alert-{{ 'error' if category == 'error' else 'success' }}">
              <svg width="18" height="18" fill="currentColor" viewBox="0 0 20 20">
                {% if category == 'error' %}
                  <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"></path>
                {% else %}
                  <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path>
                {% endif %}
              </svg>
              <span>{{ message }}</span>
            </div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <form id="admin-login-form" action="{{ url_for('admin_login') }}" method="POST">
      <div class="form-group">
        <label for="username">Username</label>
        <div class="input-wrapper">
          <input 
            type="text" 
            id="username" 
            name="username" 
            class="form-control" 
            placeholder="Enter admin username" 
            required 
            autocomplete="username"
          >
          <span class="input-icon">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
            </svg>
          </span>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <input 
            type="password" 
            id="password" 
            name="password" 
            class="form-control" 
            placeholder="Enter admin password" 
            required
            autocomplete="current-password"
          >
          <span class="input-icon">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
            </svg>
          </span>
        </div>
      </div>

      <button type="submit" class="btn-login" id="login-submit-btn">Authenticate</button>
    </form>

    <a href="{{ url_for('home') }}" class="back-to-home" id="btn-back-home">&larr; Back to Main Website</a>
  </div>

</body>
</html>
